<article class="card">
  <h2>{{ livro().titulo }}</h2>
  <p>Autor: {{ livro().autor }}</p>
  <p>Categoria: {{ livro().categoria }}</p>
  <p>Ano: {{ livro().ano }}</p>
  <p>Status: {{ livro().status }}</p>
  <p>{{ livro().descricao }}</p>
  <a [routerLink]="['/livros', livro().id]"> Ver detalhes </a>
</article>
